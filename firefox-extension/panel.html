<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Agent Bridge for Firefox</title>
    <style>
      body {
        font: 13px/1.4 system-ui, sans-serif;
        width: 320px;
        margin: 0;
        padding: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      #state {
        font-weight: 600;
        margin-bottom: 6px;
      }
      #state.connected {
        color: #137333;
      }
      #state.error {
        color: #c5221f;
      }
      pre {
        background: #f5f5f5;
        border-radius: 4px;
        padding: 8px;
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>Agent Bridge for Firefox</h1>
    <div id="state">unknown</div>
    <pre id="status"></pre>
    <script src="panel.js"></script>
  </body>
</html>
